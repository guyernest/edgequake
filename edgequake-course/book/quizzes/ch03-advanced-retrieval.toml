# Quiz: Advanced Retrieval

id = "ch03-advanced-retrieval"
title = "Advanced Retrieval"
lesson_id = "ch03"
pass_threshold = 0.7

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What does contextual retrieval add to each chunk before embedding it?"
prompt.distractors = [
    "A summary of the user's most likely query intent",
    "Keywords extracted from the chunk using TF-IDF",
    "A vector representation of the chunk's position in the document"
]
answer.answer = "A short context preamble generated by an LLM that situates the chunk within the full document"
context = """
Contextual retrieval uses an LLM to generate a brief preamble for each chunk that
explains where it fits in the document. For example, a chunk mentioning 'the
agreement' gets a preamble like 'This chunk is from a 2019 NDA between Company A
and Company B, discussing termination clauses.' This preamble is prepended to the
chunk before embedding, so the vector captures document-level context that would
otherwise be lost during chunking.
"""
id = "d3c4e5f6-3333-4c00-b300-000000000001"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "How does BM25 complement vector similarity search in a hybrid retrieval system?"
prompt.distractors = [
    "BM25 filters out irrelevant documents before vector search runs",
    "BM25 reduces the dimensionality of embedding vectors for faster search",
    "BM25 generates query expansions that improve embedding quality"
]
answer.answer = "BM25 excels at exact keyword matching (names, codes, IDs) where semantic embeddings may miss lexical matches"
context = """
Vector search captures semantic meaning but can miss exact lexical matches. A query
for 'ACME-2024-001' may not rank the right document highly if the embedding focuses
on semantic concepts. BM25 uses term frequency and inverse document frequency for
precise keyword matching. Hybrid search combines both: semantic understanding from
vectors and lexical precision from BM25, covering both fuzzy and exact retrieval needs.
"""
id = "d3c4e5f6-3333-4c00-b300-000000000002"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "What does Reciprocal Rank Fusion (RRF) do when combining results from multiple retrieval methods?"
prompt.distractors = [
    "It averages the raw scores from each retrieval method",
    "It picks the highest-scoring result from any single method",
    "It trains a model to learn optimal weights for each method"
]
answer.answer = "It merges ranked lists by summing reciprocal rank scores, giving consistent fusion without needing score normalization"
context = """
RRF assigns each result a score of 1/(k + rank) where k is a constant (typically 60)
and rank is the result's position in each retrieval list. Scores are summed across
lists. This elegantly handles the problem that raw scores from different systems
(BM25 vs cosine similarity) are on incomparable scales. RRF only uses rank positions,
making it simple and effective without any score normalization.
"""
id = "d3c4e5f6-3333-4c00-b300-000000000003"

[[questions]]
type = "MultipleChoice"
prompt.prompt = "Why is reranking applied after initial retrieval rather than used as the primary search method?"
prompt.distractors = [
    "Rerankers produce lower quality scores than bi-encoders",
    "Rerankers cannot process text longer than 128 tokens",
    "Rerankers require training on the specific document collection"
]
answer.answer = "Cross-encoder rerankers are O(n) per query-document pair, making them too expensive for full corpus search but ideal for refining a small candidate set"
context = """
Cross-encoder rerankers jointly process the query and each candidate, enabling deep
token-level attention between them. This produces highly accurate relevance scores
but requires a forward pass for every query-document pair. Running this against
millions of documents would be prohibitively slow. Instead, fast bi-encoder retrieval
narrows candidates to ~100, then the reranker precisely reorders this small set.
"""
id = "d3c4e5f6-3333-4c00-b300-000000000004"

[[questions]]
type = "ShortAnswer"
prompt.prompt = "What type of query does naive vector-only RAG struggle with most, which motivates the use of knowledge graphs?"
answer.answer = "multi-hop"
context = """
Multi-hop queries require connecting information across multiple documents or chunks.
For example, 'Who are the business partners of people connected to Entity X?' requires
traversing relationships: find people connected to X, then find their business partners.
Vector similarity retrieves chunks independently and cannot follow relationship chains.
Knowledge graphs explicitly model entities and relationships, enabling multi-hop
traversal that pure vector search cannot perform.
"""
id = "d3c4e5f6-3333-4c00-b300-000000000005"
