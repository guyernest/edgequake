[package]
name = "edgequake-batch"
description = "Batch ingestion CLI for EdgeQuake knowledge graph construction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "edgequake-batch"
path = "src/main.rs"

[dependencies]
# Workspace crates
edgequake-core = { workspace = true }
edgequake-pipeline = { workspace = true }
edgequake-schema = { workspace = true }
edgequake-storage = { workspace = true }
edgequake-storage-aws = { workspace = true, features = ["full"] }
edgequake-llm = { workspace = true }

# BM25 text preprocessing (shared tokenizer pipeline)
tantivy = { workspace = true }

# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Parquet reading
parquet = { version = "53.2", features = ["async"] }
arrow = { version = "53.2" }

# Progress bars
indicatif = "0.17"

# Hashing
sha2 = "0.10"

# Configuration
toml = "0.8"
indexmap = { version = "2.7", features = ["serde"] }

# Utilities
uuid = { workspace = true }
chrono = { workspace = true }

# File system traversal
walkdir = { workspace = true }
globset = { workspace = true }

# YAML parsing
serde_yaml = { workspace = true }

# AWS SDK (for DynamoDB state management + Neptune bulk load)
aws-config = "1.5"
aws-sdk-dynamodb = "1.53"
aws-sdk-neptunedata = "1"
aws-sdk-s3 = "1"
aws-sdk-sts = "1"
aws-smithy-types = "1"

# CSV generation (Neptune Gremlin bulk load format)
csv = "1.3"

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = "3.13"
