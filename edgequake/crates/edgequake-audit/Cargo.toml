[package]
name = "edgequake-audit"
version = "0.2.2"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full", "sync"] }

# Database
# WHY: Use rustls (not native-tls) so cross-compilation for aarch64-unknown-linux-gnu
# (cargo lambda build --arm64) works without a vendored OpenSSL cross-toolchain.
# runtime-tokio + tls-rustls-ring-webpki is equivalent to the deprecated
# runtime-tokio-rustls alias and matches the workspace sqlx feature set.
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls-ring-webpki",
    "postgres",
    "uuid",
    "chrono",
    "json",
] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.11", features = ["v4", "serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"

[dev-dependencies]
tokio-test = "0.4"
