# EdgeQuake Domain Configuration: Epstein Investigation Dataset
#
# This is the reference configuration for the Jeffrey Epstein criminal
# investigation dataset. Use it as a starting point for your own domain configs.
#
# Usage:
#   edgequake-batch --domain-config epstein.toml --data data.parquet run
#
# Or set the environment variable:
#   export EDGEQUAKE_DOMAIN_CONFIG=epstein.toml

[domain]
name = "epstein"
description = "Jeffrey Epstein criminal investigation dataset"
language = "English"

[entity_types]
PERSON = "Named individuals (Jeffrey Epstein, Ghislaine Maxwell, Bill Clinton, Donald Trump, etc.)"
ORGANIZATION = "Companies, foundations, government agencies (J. Epstein & Co, DOJ, FBI, SEC, etc.)"
LOCATION = "Places, addresses, properties (Palm Beach, Little St. James, Manhattan townhouse, etc.)"
LEGAL_CASE = "Court cases, indictments, complaints (US v. Epstein, civil suit 08-80736, etc.)"
FINANCIAL_ITEM = "Money flows, transactions, assets (wire transfer, trust fund, property sale, etc.)"
ALLEGATION = "Specific alleged criminal acts (trafficking, obstruction, perjury, etc.)"
COMMUNICATION = "Documented contacts between parties (phone call, email, meeting, flight log entry, etc.)"
DOCUMENT = "Referenced documents, filings, records (NPA, flight log, subpoena, deposition, etc.)"

# Alias mappings: canonical_name -> [aliases]
# These feed into the EntityResolver for post-extraction deduplication.
[aliases]
VIRGINIA_GIUFFRE = ["VIRGINIA_ROBERTS", "VIRGINIA_ROBERTS_GIUFFRE", "VIRGINIA_L._GIUFFRE", "VIRGINIA_L._ROBERTS", "MS._GIUFFRE", "MS._ROBERTS"]
DONALD_TRUMP = ["DONALD_J._TRUMP", "DONALD_J_TRUMP", "PRESIDENT_TRUMP", "TRUMP"]
JEFFREY_EPSTEIN = ["J._EPSTEIN", "J_EPSTEIN", "EPSTEIN", "MR._EPSTEIN"]
GHISLAINE_MAXWELL = ["G._MAXWELL", "MS._MAXWELL", "MAXWELL"]
BILL_CLINTON = ["WILLIAM_CLINTON", "WILLIAM_J._CLINTON", "WILLIAM_JEFFERSON_CLINTON", "PRESIDENT_CLINTON", "CLINTON"]
ANDREW_DUKE_OF_YORK = ["PRINCE_ANDREW", "ANDREW_WINDSOR", "DUKE_OF_YORK", "THE_DUKE_OF_YORK"]
ALAN_DERSHOWITZ = ["ALAN_M._DERSHOWITZ", "PROFESSOR_DERSHOWITZ", "DERSHOWITZ"]
LES_WEXNER = ["LESLIE_WEXNER", "LESLIE_H._WEXNER", "L._WEXNER", "WEXNER"]
"JEAN-LUC_BRUNEL" = ["JEAN_LUC_BRUNEL", "BRUNEL", "J.L._BRUNEL", "JL_BRUNEL"]
SARAH_KELLEN = ["SARAH_KELLEN_VICKERS", "KELLEN"]
NADIA_MARCINKOVA = ["NADIA_MARCINKO", "NADA_MARCINKOVA"]
"MAR-A-LAGO" = ["MAR-A-LAGO_CLUB", "MAR-A-LAGO_RESORT", "MAR-A-LAGO_ESTATE"]
"LITTLE_ST._JAMES" = ["LITTLE_SAINT_JAMES", "LITTLE_ST_JAMES", "LITTLE_SAINT_JAMES_ISLAND", "LITTLE_ST._JAMES_ISLAND"]
ZORRO_RANCH = ["ZORRO_RANCH"]
JEFFREY_EPSTEIN_FOUNDATION = ["EPSTEIN_FOUNDATION"]
"J._EPSTEIN_&_CO." = ["J._EPSTEIN_&_COMPANY", "J._EPSTEIN_AND_COMPANY"]
WEXNER_FOUNDATION = ["THE_WEXNER_FOUNDATION"]
FBI = ["FEDERAL_BUREAU_OF_INVESTIGATION", "F.B.I."]
DOJ = ["DEPARTMENT_OF_JUSTICE", "DEPT._OF_JUSTICE", "U.S._DEPARTMENT_OF_JUSTICE"]
SDNY = ["SOUTHERN_DISTRICT_OF_NEW_YORK", "S.D.N.Y.", "U.S._ATTORNEY'S_OFFICE_SDNY"]
PALM_BEACH_POLICE_DEPARTMENT = ["PALM_BEACH_POLICE", "PBPD"]

[prompts]
role_description = "You are a Knowledge Graph Specialist responsible for extracting entities and relationships from legal, financial, and investigative documents related to the Jeffrey Epstein case and associated investigations."

canonicalization_examples = [
    '"Virginia Giuffre" (NOT "Virginia Roberts", "Virginia Roberts Giuffre", or "Jane Doe No. 102")',
    '"Donald Trump" (NOT "Donald J. Trump" or "President Trump")',
    '"Mar-A-Lago" (NOT "Mar-A-Lago Club" or "Mar-A-Lago Resort")',
    '"Ghislaine Maxwell" (NOT "G. Maxwell" or "Ms. Maxwell")',
]

[[prompts.extra_instructions]]
title = "Timestamp Instructions"
content = """
For every entity and relationship, if a date or time period can be inferred from the
document context, append [TIMESTAMP: YYYY-MM-DD] at the end of the description field.
Use the most specific date available:
- Full date: [TIMESTAMP: 2019-05-30]
- Month only: [TIMESTAMP: 2019-05]
- Year only: [TIMESTAMP: 2019]
- Date range: [TIMESTAMP: 2008-01/2008-06]

Sources of dates:
- Email "Sent:" headers
- Document filing dates
- Dates mentioned in the text ("On March 23, 2017...")
- Transaction dates in financial records

If no date can be determined, omit the timestamp suffix entirely."""

[[prompts.extra_instructions]]
title = "Email-Specific Instructions"
content = """
Many documents are email exchanges. For emails:
1. Extract PERSON entities for all senders (From:), recipients (To:, CC:, BCC:)
2. Use the email "Sent:" date as the timestamp for all entities/relationships in that email
3. If the email discusses meetings, calls, or visits, create COMMUNICATION entities
4. If the email references legal matters, create LEGAL_CASE entities
5. Email chains (Re:, Fwd:) may contain multiple conversations - extract from all, using each sub-email's date
6. Confidentiality notices at the end of emails should be ignored for extraction"""

[[prompts.user_instructions]]
content = "Append [TIMESTAMP: YYYY-MM-DD] to descriptions when dates can be inferred."

[[prompts.user_instructions]]
content = "For emails, use the Sent: date as the timestamp."

# Relationship keywords by category.
# These are injected into the system prompt as structured vocabulary.
[relationship_keywords]
financial = [
    { keyword = "financial_transaction", description = "payments, wire transfers" },
    { keyword = "financial_control", description = "owns, manages assets" },
    { keyword = "financial_benefit", description = "gifts, loans, trust beneficiary" },
]
legal = [
    { keyword = "legal_representation", description = "attorney-client" },
    { keyword = "defendant", description = "accused in case" },
    { keyword = "plaintiff", description = "accuser in case" },
    { keyword = "witness_testimony", description = "testified about" },
    { keyword = "plea_agreement", description = "NPA, cooperation deal" },
    { keyword = "legal_filing", description = "filed motion, subpoena" },
]
travel = [
    { keyword = "travel_companion", description = "traveled together" },
    { keyword = "travel_destination", description = "visited location" },
    { keyword = "flight_log", description = "documented on flight" },
]
employment = [
    { keyword = "employer", description = "hired, employed" },
    { keyword = "employee", description = "worked for" },
    { keyword = "associate", description = "business associate" },
]
social = [
    { keyword = "personal_relationship", description = "friend, romantic, familial" },
    { keyword = "introduced_by", description = "connected two parties" },
    { keyword = "recruited", description = "recruited for activities" },
]
communication = [
    { keyword = "communicated_with", description = "email, phone, letter" },
    { keyword = "meeting", description = "in-person meeting" },
]
property = [
    { keyword = "property_owner", description = "owns property" },
    { keyword = "resided_at", description = "lived at location" },
    { keyword = "visited", description = "visited location" },
]
organizational = [
    { keyword = "member_of", description = "belongs to organization" },
    { keyword = "founded", description = "created organization" },
    { keyword = "donated_to", description = "charitable contribution" },
]
criminal = [
    { keyword = "alleged_abuse", description = "alleged criminal conduct" },
    { keyword = "conspiracy", description = "coordinated illegal activity" },
    { keyword = "obstruction", description = "interfered with investigation" },
    { keyword = "trafficking", description = "human trafficking" },
]
evidentiary = [
    { keyword = "mentioned_in", description = "referenced in document" },
    { keyword = "evidence_of", description = "proves/supports claim" },
    { keyword = "contradicts", description = "conflicts with testimony" },
]

# Few-shot examples.
# Use {td} for tuple delimiter and {cd} for completion delimiter placeholders.
# These get substituted with the actual delimiters at runtime.

